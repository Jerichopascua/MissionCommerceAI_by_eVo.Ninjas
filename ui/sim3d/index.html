<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sim.PesoWeb 3D Customer Simulation – Sample</title>
<style>
  :root{--bg:#e6edf8;--panel:rgba(255,255,255,.93);--panel2:#f1f5fb;--line:#dbe3ef;--text:#1b2740;--mute:#6b7a93;--acc:#2f6bff;--warn:#c47d00;--bad:#e5484d;--good:#1fa463;--blue:#2f6bff;--shadow:0 8px 24px rgba(30,50,90,.14)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 "Inter",system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
  button{font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)} button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  button.primary{background:var(--acc);color:#fff;font-weight:600;border-color:var(--acc)} button.primary:hover{color:#fff;filter:brightness(1.08)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .mute{color:var(--mute)} .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--line);background:var(--panel2)}
  .tag.ok{color:var(--good);border-color:#bfe6d1;background:#eaf8f0} .tag.warn{color:var(--warn);border-color:#f0dcae;background:#fff6e0} .tag.bad{color:var(--bad);border-color:#f3c3c5;background:#fdecec}
  .fcard{background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:14px;box-shadow:var(--shadow)}

  /* ---------- wizard ---------- */
  #wizard{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 25% 15%,#f5f9ff,#dfe8f6 65%);z-index:10}
  #wizard .card{width:min(760px,94vw);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px}

  .crumbs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
  .crumbs span{padding:2px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
  .crumbs span.cur{color:#fff;background:var(--acc);border-color:var(--acc)} .crumbs span.done{color:var(--text)}
  .list{display:grid;gap:8px}

  .item:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(47,107,255,.15)} .item b{font-size:14px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:8px 0} .kv div:nth-child(odd){color:var(--mute)}
  .err{border:1px solid #f3c3c5;background:#fdecec;border-radius:10px;padding:10px 12px;margin:10px 0}
  .steps li{padding:2px 0;color:var(--mute)} .steps li.done{color:var(--good)} .steps li.cur{color:var(--text)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ---------- app: full-bleed 3D with floating cards ---------- */
  #app{position:fixed;inset:0;display:none}
  #stage{position:absolute;inset:0} #stage canvas{display:block;width:100%;height:100%}
  #top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:12px;align-items:center;pointer-events:none;z-index:3}
  #top>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:9px;padding:7px 14px;font-weight:700;font-size:15px}
  .brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;font-style:normal;font-size:14px}
  .ctx{display:flex;gap:16px;padding:6px 16px;margin:0 auto}
  .ctx small,.lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
  .ctx b.srcv{color:var(--warn)}
  .live{display:flex;align-items:center;gap:8px;padding:7px 14px;font-weight:600}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px #1fa46333}
  #kpis{position:absolute;top:66px;left:12px;display:flex;gap:10px;z-index:2}
  .kpi{padding:8px 14px;min-width:132px} .kpi b{display:block;font-size:20px;line-height:1.15} .kpi span{font-size:11px;color:var(--mute)}
  #left{position:absolute;left:12px;top:140px;bottom:256px;width:250px;overflow:auto;padding:12px;z-index:2}
  #right{position:absolute;right:12px;top:66px;bottom:256px;width:300px;overflow:auto;padding:12px;z-index:2}
  #timeline{position:absolute;left:12px;bottom:12px;width:min(620px,calc(100% - 340px));height:232px;overflow:auto;padding:8px 12px;z-index:2}
  #timeline .ev{display:flex;gap:10px;padding:2px 4px;border-radius:5px;cursor:pointer} #timeline .ev:hover{background:var(--panel2)}
  #timeline .ev .t{color:var(--mute);width:62px;flex:none}
  #controls{position:absolute;right:12px;bottom:12px;width:300px;height:232px;overflow:auto;padding:10px 12px;z-index:2}
  h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
  .stat b{display:block;font-size:16px} .stat span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .bar{height:6px;background:#e3eaf5;border-radius:4px;overflow:hidden;margin:3px 0 8px} .bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
  .na{color:var(--mute);font-style:italic}
  .chip{display:inline-block;margin:1px 3px 1px 0;padding:1px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:11px}
  .chip.got{border-color:#bfe6d1;color:var(--good);background:#eaf8f0} .chip.rej{border-color:#f3c3c5;color:var(--bad);background:#fdecec} .chip.sub{border-color:#f0dcae;color:var(--warn);background:#fff6e0}
  #layoutNote{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:34%;background:#ffffffcc;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:11px;color:var(--mute);text-align:center;z-index:2}
  #diag{position:absolute;left:50%;transform:translateX(-50%);top:66px;background:#ffffffb0;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:10px;color:var(--mute);white-space:pre;z-index:2}
  @media (max-width:1150px){#diag{display:none}#layoutNote{display:none}}
</style>

<body>

<!-- ============ ENTRY WIZARD: Tenant -> Branch -> Scenario -> Summary -> Load ============ -->
<div id="wizard"><div class="card" id="wizcard"></div></div>

<!-- ============ APP (full-bleed 3D scene + floating cards) ============ -->
<div id="app">
  <div id="stage"></div>
  <div id="top"></div>
  <div id="kpis"></div>
  <div id="diag" class="mono"></div>
  <div id="left" class="fcard"></div>
  <div id="right" class="fcard"></div>
  <div id="timeline" class="fcard"></div>
  <div id="controls" class="fcard"></div>
  <div id="layoutNote"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
/* =====================================================================
   Sim.PesoWeb 3D Customer Simulation – plain HTML sample
   Layers (mirrors the planned src/ layout):
     1. contracts   – SimulationScenarioV1 shape + validator
     2. api         – SimulationDataProvider interface, MockSimulationDataProvider
     3. simulation  – ScenarioSimulationEngine (no DOM, no THREE)
     4. world3d     – Three.js renderer (reads engine state, never mutates source data)
     5. ui          – wizard, dashboard, customer panel, timeline
   Sim.PesoWeb is the source of truth; everything below "api" only sees
   what a provider returns. The mock exists only for local development.
   ===================================================================== */

/* ---------------------------------------------------------------- 1. CONTRACT */
const SUPPORTED_CONTRACT = 'SimulationScenarioV1';
function validateScenario(sc, tenantId, branchId){
  const errs = [], warns = [];
  if(sc.contractVersion !== SUPPORTED_CONTRACT) errs.push(`Unsupported scenario version "${sc.contractVersion}" (expected ${SUPPORTED_CONTRACT}).`);
  if(sc.tenant?.id !== tenantId) errs.push('Tenant consistency: scenario tenant does not match selected tenant.');
  if(sc.branch?.id !== branchId) errs.push('Branch consistency: scenario branch does not match selected branch.');
  if(!sc.meta?.id) errs.push('Missing scenario ID.');
  if(!sc.params) errs.push('Missing simulation parameters.');
  if(!sc.products?.length) errs.push('Missing product data.');
  if(!sc.customers?.length) errs.push('Missing customer data.');
  const pids = new Set((sc.products||[]).map(p=>p.id));
  const stockIds = new Set((sc.inventory||[]).map(i=>i.productId));
  (sc.products||[]).forEach(p=>{ if(!stockIds.has(p.id)) errs.push(`Inventory reference missing for product ${p.id}.`); });
  (sc.customers||[]).forEach(c=>{
    (c.mission?.productIds||[]).forEach(id=>{ if(!pids.has(id)) errs.push(`Customer ${c.id}: mission references unknown product ${id}.`); });
  });
  if(!sc.layout) warns.push('Missing layout data – default visualization layout will be used.');
  return {errs, warns};
}

/* ---------------------------------------------------------------- 2. API LAYER */
/* SimulationDataProvider interface (documented by duck-typing in this sample):
     getTenants() / getBranches(tenantId) / getScenarios(tenantId, branchId) / getScenario(tenantId, branchId, scenarioId)
   RealSimulationDataProvider would implement the same four methods against a configurable base URL.
   It is NOT implemented here: no real Sim.PesoWeb endpoint contract has been supplied yet. */
const CONFIG = { dataSource: 'mock' /* 'api' | 'mock' – never silently fall back */, apiBaseUrl: '' };

class RealSimulationDataProvider {
  label(){ return 'SIM.PESOWEB API'; }
  async _na(){ throw new Error('Unable to load Sim.PesoWeb data. The real API contract has not been supplied/configured (VITE_SIMULATION_API_BASE_URL).'); }
  getTenants(){return this._na();} getBranches(){return this._na();} getScenarios(){return this._na();} getScenario(){return this._na();}
}

class MockSimulationDataProvider {   // ---- LOCAL DEVELOPMENT ONLY ----
  label(){ return 'LOCAL MOCK'; }
  _delay(v, ms=350){ return new Promise(r=>setTimeout(()=>r(structuredClone(v)), ms)); }

  async getTenants(){ return this._delay(MOCK.tenants.map(t=>({...t, branchCount: MOCK.branches.filter(b=>b.tenantId===t.id).length}))); }
  async getBranches(tenantId){ return this._delay(MOCK.branches.filter(b=>b.tenantId===tenantId).map(b=>({...b, scenarioCount: MOCK.scenarios.filter(s=>s.branchId===b.id).length}))); }
  async getScenarios(tenantId, branchId){ return this._delay(MOCK.scenarios.filter(s=>s.tenantId===tenantId && s.branchId===branchId).map(s=>s.meta ? {...s.meta, id:s.id, tenantId, branchId, params:s.params} : s)); }
  async getScenario(tenantId, branchId, scenarioId){
    const s = MOCK.scenarios.find(x=>x.id===scenarioId && x.tenantId===tenantId && x.branchId===branchId);
    if(!s) throw new Error('Scenario not found for this tenant/branch.');
    return this._delay(buildScenarioPayload(s), 700);
  }
}

/* ---- mock fixtures (mock-only; seeded so runs are repeatable) ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const MOCK = (()=>{
  const tenants = [
    {id:'T-ABC', name:'ABC Grocery Corporation', status:'ACTIVE'},
    {id:'T-KOP', name:'Kopi Kita Retail Group', status:'ACTIVE'},
    {id:'T-MBS', name:'Mabuhay Supermart', status:'TRIAL'},
  ];
  const branches = [
    {id:'B-ABC-MNL', tenantId:'T-ABC', name:'Manila Main Branch', location:'Manila, PH', status:'OPEN', storeType:'Supermarket'},
    {id:'B-ABC-KL',  tenantId:'T-ABC', name:'KL Main Branch', location:'Kuala Lumpur, MY', status:'OPEN', storeType:'Supermarket'},
    {id:'B-ABC-CEB', tenantId:'T-ABC', name:'Cebu Express', location:'Cebu, PH', status:'OPEN', storeType:'Convenience'},
    {id:'B-KOP-001', tenantId:'T-KOP', name:'Kopi Kita Central', location:'Quezon City, PH', status:'OPEN', storeType:'Grocery'},
    {id:'B-KOP-002', tenantId:'T-KOP', name:'Kopi Kita Makati', location:'Makati, PH', status:'RENOVATING', storeType:'Grocery'},
    {id:'B-MBS-001', tenantId:'T-MBS', name:'Mabuhay Davao', location:'Davao, PH', status:'OPEN', storeType:'Supermarket'},
  ];
  const mk = (tenantId, branchId, sfx, name, type, desc, objective, customers, pop, days, params)=>({
    id:`S-${branchId}-${sfx}`, tenantId, branchId, params,
    meta:{ name, type, description:desc, objective, customerPopulation:pop, productCount:2431, expectedTransactions:Math.round(pop*0.82),
           days, startDate:'2026-03-14', status:'READY', dataVersion:'v1.4', configVersion:'c7', sampleCustomers:customers }
  });
  const scenarios = [];
  branches.forEach(b=>{
    scenarios.push(mk(b.tenantId,b.id,'RUSH','Weekend Grocery Rush','WEEKEND_GROCERY_RUSH',
      'Saturday traffic surge: large weekly-shop baskets arrive in a compressed window.','Check checkout throughput and mission completion under peak load.',
      80,12540,7,{arrivalWindowSec:2700,stockMult:1,competitorPressure:0,stockOverrides:{},seed:11}));
    scenarios.push(mk(b.tenantId,b.id,'COMP','Competitor Price Reduction','COMPETITOR_PRICE_REDUCTION',
      'A nearby competitor cut staple prices ~10%. Bargain-hunters compare harder and reject more.','Measure conversion and basket loss to price-sensitive segments.',
      60,12540,7,{arrivalWindowSec:3600,stockMult:1,competitorPressure:0.45,stockOverrides:{},seed:23}));
    scenarios.push(mk(b.tenantId,b.id,'OOS','Inventory Stockout','PRODUCT_STOCKOUT',
      'Supplier delay leaves Rice, Chicken and Milk critically low.','Quantify failed missions caused by unavailable products.',
      70,12540,7,{arrivalWindowSec:3000,stockMult:1,competitorPressure:0.1,stockOverrides:{'P-RICE':6,'P-CHKN':5,'P-MILK':8},seed:37}));
  });
  return {tenants, branches, scenarios};
})();

const CATEGORY_COLORS = {Grains:0xd9b44a,Meat:0xd2554f,Pantry:0xa96b3a,Dairy:0x7fb7e6,Bakery:0xe8a96b,Beverage:0x5aa469,Produce:0x7bc86c,Household:0x9a7fd1};
// slot: row z, stand z (where a customer stands), x. zone: aisle id
const PRODUCTS = [
  ['P-RICE','Rice 5kg','Grains',250,200,-12.5,-9,-7.6],['P-OIL','Cooking Oil 1L','Pantry',95,75,-7.5,-9,-7.6],
  ['P-SUGR','Sugar 1kg','Pantry',85,68,-2.5,-9,-7.6],['P-SOY','Soy Sauce','Pantry',30,22,2.5,-9,-7.6],
  ['P-NOOD','Instant Noodles','Pantry',15,11,7.5,-9,-7.6],['P-SARD','Canned Sardines','Pantry',28,21,12.5,-9,-7.6],
  ['P-COFE','Coffee 3in1','Beverage',60,45,-10,-4,-5.4],['P-BISC','Biscuits','Pantry',25,17,-5,-4,-5.4],
  ['P-DETG','Detergent','Household',85,62,0,-4,-5.4],['P-SOAP','Bath Soap','Household',40,28,5,-4,-5.4],
  ['P-WATR','Water 6L','Beverage',55,38,10,-4,-5.4],
  ['P-MILK','Milk 1L','Dairy',120,95,-10,1,-0.4],['P-EGGS','Eggs Tray','Dairy',210,170,-5,1,-0.4],
  ['P-BRED','Bread Loaf','Bakery',65,45,0,1,-0.4],['P-BANA','Bananas 1kg','Produce',70,50,5,1,-0.4],
  ['P-CHKN','Chicken 1kg','Meat',190,150,10,1,-0.4],
].map(([id,name,category,price,cost,x,rowZ,standZ])=>({id,name,category,price,cost,slot:{x,rowZ,standZ}}));

const DEFAULT_LAYOUT_SLOTS = Object.fromEntries(PRODUCTS.map(p=>[p.id,p.slot]));   // documented default visualization layout

const SEGMENTS = [
  {id:'FAMILY', name:'Weekly Family',   mission:'Weekly Grocery', items:[6,8], budgetMult:1.25, color:0x58a6ff, compare:0.3, weight:0.35},
  {id:'BARGAIN',name:'Bargain Hunter',  mission:'Bargain Run',    items:[4,6], budgetMult:1.05, color:0xe3b341, compare:0.9, weight:0.30},
  {id:'QUICK',  name:'Quick Trip',      mission:'Quick Top-up',   items:[2,3], budgetMult:1.6,  color:0x56d364, compare:0.1, weight:0.25},
  {id:'PREMIUM',name:'Premium Shopper', mission:'Premium Basket', items:[4,5], budgetMult:1.7,  color:0xc58af9, compare:0.2, weight:0.10},
];

function buildScenarioPayload(s){
  const rnd = mulberry32(s.params.seed), n = s.meta.sampleCustomers;
  const stock = PRODUCTS.map(p=>({productId:p.id, onHand: s.params.stockOverrides[p.id] ?? Math.round(30*s.params.stockMult)}));
  const customers = [];
  for(let i=0;i<n;i++){
    let r=rnd(), seg=SEGMENTS[0]; for(const g of SEGMENTS){ if((r-=g.weight)<=0){seg=g;break;} }
    const count = seg.items[0] + Math.floor(rnd()*(seg.items[1]-seg.items[0]+1));
    const pool = [...PRODUCTS].sort(()=>rnd()-.5).slice(0,count);
    const need = pool.reduce((a,p)=>a+p.price,0);
    customers.push({
      id:'C'+String(1001+i), segmentId:seg.id,
      arriveAtSec: Math.floor(rnd()*s.params.arrivalWindowSec),
      budget: Math.round(need*seg.budgetMult*(0.8+rnd()*0.4)),
      loyaltyTier: ['None','Silver','Gold'][Math.floor(rnd()*3)],
      mission:{name:seg.mission, productIds:pool.map(p=>p.id)},
      // NOTE: purchaseHistory is deliberately absent -> UI must show "Not available in scenario data."
    });
  }
  customers.sort((a,b)=>a.arriveAtSec-b.arriveAtSec);
  const tenant = MOCK.tenants.find(t=>t.id===s.tenantId), branch = MOCK.branches.find(b=>b.id===s.branchId);
  return {
    contractVersion:'SimulationScenarioV1',
    tenant:{id:tenant.id,name:tenant.name}, branch:{id:branch.id,name:branch.name},
    meta:{id:s.id, name:s.meta.name, type:s.meta.type, description:s.meta.description, objective:s.meta.objective, startDate:s.meta.startDate,
          dataVersion:s.meta.dataVersion, configVersion:s.meta.configVersion, status:s.meta.status},
    params:s.params, segments:SEGMENTS.map(({id,name,compare})=>({id,name,compare})),
    products:PRODUCTS.map(({id,name,category,price,cost})=>({id,name,category,price,cost})),
    inventory:stock, customers,
    layout:null, // mock supplies no layout -> renderer uses the documented default visualization layout
  };
}

/* ---------------------------------------------------------------- 3. SIMULATION ENGINE */
/* Independent of DOM/THREE. Clones source data; never mutates the loaded snapshot. */
const WALK_SPEED = 1.4; // world units per scenario second
const SIDE_X = 16.2, DOOR_Z = 12.5, SPAWN_Z = 15.5, FRONT_Z = 5;
const COUNTERS = [-9,-4.5,0].map(x=>({x, z:8.2, queue:0}));

function zoneOf(z){ return z < -3.9 ? 1 : (z < 1.0 ? 2 : 3); }  // 1 = back aisle, 2 = middle aisle, 3 = front/open area
function route(from, to){
  if(zoneOf(from.z)===zoneOf(to.z)) return [[to.x,to.z]];
  const side = (from.x+to.x)/2 >= 0 ? SIDE_X : -SIDE_X;
  return [[side,from.z],[side,to.z],[to.x,to.z]];
}
const fmtClock = s => { const d=Math.floor(s/86400), t=Math.floor(s%86400)+8*3600, h=Math.floor(t/3600)%24, m=Math.floor(t/60)%60, sec=t%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); };

class ScenarioSimulationEngine {
  constructor(scenario){ this.source = scenario; this.listeners = []; this.reset(); }
  on(fn){ this.listeners.push(fn); }
  reset(){
    const sc = this.source;
    this.t = 0; this.evSeq = 0; this.events = []; this.rnd = mulberry32(sc.params.seed*7+1);
    // shelf slot comes from scenario layout when supplied, otherwise from the default visualization layout
    this.products = new Map(sc.products.map(p=>[p.id,{...p, slot: sc.layout?.slots?.[p.id] ?? DEFAULT_LAYOUT_SLOTS[p.id]}]));
    this.stock = new Map(sc.inventory.map(i=>[i.productId,i.onHand]));
    this.stockedOut = new Set();
    this.counters = COUNTERS.map(c=>({...c,queue:0}));
    this.customers = sc.customers.map(c=>({
      src:c, id:c.id, seg:c.segmentId, state:'PENDING', pos:{x:0,z:SPAWN_Z}, last:{x:0,z:SPAWN_Z},
      speed:WALK_SPEED*(0.8+((this.rnd())*0.4)), queue:[], phase:'items', itemIdx:0, wait:0,
      basket:[], viewed:[], selected:[], rejected:[], substituted:[], outcome:null,
      decision:'Waiting to enter store', explain:'—', paid:0, satisfaction:null,
    }));
    this.m = {entered:0, completed:0, failed:0, abandoned:0, revenue:0, cogs:0, purchases:0, items:0, processed:0};
    this.emit('ScenarioReset',null,null,`Scenario "${sc.meta.name}" ready – ${this.customers.length} seed customers, ${this.products.size} products.`);
  }
  emit(type, c, pid, text, extra={}){
    const ev = {id:++this.evSeq, t:this.t, type, tenantId:this.source.tenant.id, branchId:this.source.branch.id, scenarioId:this.source.meta.id,
      customerId:c?.id, productId:pid, text, ...extra};
    this.events.push(ev); if(this.events.length>5000) this.events.shift();
    this.m.processed++; this.listeners.forEach(f=>f(ev));
  }
  pname(id){ return this.products.get(id)?.name ?? id; }
  segDef(c){ return SEGMENTS.find(s=>s.id===c.seg); }
  segName(c){ return this.source.segments.find(s=>s.id===c.seg).name; }

  /* ---- planning helpers ---- */
  walkTo(c, to, state){ route(c.last,to).forEach(p=>c.queue.push({k:'walk',x:p[0],z:p[1],state})); c.last={x:to.x,z:to.z}; }
  nextStage(c){
    const sc = this.source;
    if(c.phase==='items'){
      if(c.itemIdx < c.src.mission.productIds.length){
        const pid = c.src.mission.productIds[c.itemIdx++], p = this.products.get(pid);
        c.queue.push({k:'note',state:'BROWSING',onStart:()=>{c.decision=`Heading to ${p.name}`;}});
        this.walkTo(c,{x:p.slot.x, z:p.slot.standZ},'BROWSING');
        c.queue.push({k:'wait',s:5,state:'VIEWING_PRODUCT',onStart:()=>{ c.viewed.push(pid); c.decision=`Looking at ${p.name}`; this.emit('CustomerViewedProduct',c,pid,`Customer ${c.id} viewed ${p.name}.`); }});
        if(this.rnd() < this.segDef(c).compare + sc.params.competitorPressure*0.3)
          c.queue.push({k:'wait',s:4,state:'COMPARING',onStart:()=>{ c.decision=`Comparing ${p.name} price`; this.emit('CustomerComparedProduct',c,pid,`Customer ${c.id} compared ${p.name} (₱${p.price}).`); }});
        c.queue.push({k:'wait',s:2,state:'SELECTING',onStart:()=>this.decide(c,pid)});
      } else c.phase='checkout';
    }
    if(c.phase==='checkout'){
      c.phase='exit';
      if(!c.basket.length){ this.finish(c,'ABANDONED'); }
      else {
        const ctr = this.counters.reduce((a,b)=>a.queue<=b.queue?a:b); ctr.queue++;
        this.walkTo(c,{x:ctr.x,z:6.4},'CHECKOUT');
        c.queue.push({k:'wait',s:8+ctr.queue*4,state:'CHECKOUT',onStart:()=>{ c.decision='Waiting at checkout'; this.emit('CustomerEnteredCheckout',c,null,`Customer ${c.id} entered checkout ${this.counters.indexOf(ctr)+1}.`); },
          onEnd:()=>{ ctr.queue=Math.max(0,ctr.queue-1); this.purchase(c); }});
      }
      return;
    }
    if(c.phase==='exit'){
      c.phase='gone';
      this.walkTo(c,{x:0,z:DOOR_Z},c.outcome||'COMPLETED'); c.queue.push({k:'walk',x:0,z:SPAWN_Z,state:c.outcome||'COMPLETED',vanish:true});
    }
  }

  /* ---- decisions ---- */
  decide(c,pid){
    const sc=this.source; let p=this.products.get(pid); const seg=this.segDef(c);
    if((this.stock.get(pid)||0)<=0){
      if(!this.stockedOut.has(pid)){ this.stockedOut.add(pid); this.emit('ProductStockout',c,pid,`${p.name} is out of stock.`); }
      const alt=[...this.products.values()].filter(q=>q.category===p.category && q.id!==pid && (this.stock.get(q.id)||0)>0);
      if(alt.length && this.rnd()<0.6){
        const q=alt[Math.floor(this.rnd()*alt.length)];
        this.take(c,q.id); c.substituted.push({from:pid,to:q.id});
        c.decision=`Substituted ${p.name} → ${q.name}`; c.explain=`${p.name} unavailable; accepted a same-category substitute.`;
        this.emit('CustomerSubstitutedProduct',c,q.id,`Customer ${c.id} substituted ${p.name} with ${q.name}.`);
      } else {
        c.rejected.push(pid); c.decision=`${p.name} unavailable – skipped`; c.explain=`${p.name} was out of stock and no acceptable substitute was taken.`;
        this.emit('CustomerRejectedProduct',c,pid,`Customer ${c.id} could not get ${p.name} (out of stock).`);
      }
      return;
    }
    const rejectProb = seg.id==='BARGAIN' ? 0.12+sc.params.competitorPressure : 0.05+sc.params.competitorPressure*0.25;
    if(this.rnd()<rejectProb){
      c.rejected.push(pid); c.decision=`Rejected ${p.name} (price)`; c.explain=`${seg.name} segment judged ₱${p.price} too high${sc.params.competitorPressure?' versus competitor':''}.`;
      this.emit('CustomerRejectedProduct',c,pid,`Customer ${c.id} rejected ${p.name} at ₱${p.price}.`); return;
    }
    this.take(c,pid); c.decision=`Selected ${p.name}`; c.explain=`${p.name} is on the mission list and within acceptable price.`;
    this.emit('CustomerSelectedProduct',c,pid,`Customer ${c.id} selected ${p.name}.`);
    this.emit('CustomerAddedToBasket',c,pid,`${p.name} added to basket of ${c.id}.`);
    // budget guard
    let total=c.basket.reduce((a,id)=>a+this.products.get(id).price,0);
    if(total>c.src.budget){
      const worst=[...c.basket].sort((a,b)=>this.products.get(b).price-this.products.get(a).price)[0];
      c.basket.splice(c.basket.indexOf(worst),1); this.stock.set(worst,(this.stock.get(worst)||0)+1);
      c.rejected.push(worst); c.selected=c.selected.filter(x=>x!==worst);
      c.decision=`Removed ${this.pname(worst)} (over budget)`; c.explain=`Basket exceeded budget ₱${c.src.budget}.`;
      this.emit('CustomerRemovedFromBasket',c,worst,`Customer ${c.id} removed ${this.pname(worst)} (over budget).`);
    }
  }
  take(c,pid){ this.stock.set(pid,this.stock.get(pid)-1); c.basket.push(pid); c.selected.push(pid);
    this.emit('InventoryUpdated',c,pid,`${this.pname(pid)} on hand: ${this.stock.get(pid)}.`,{onHand:this.stock.get(pid)}); }
  purchase(c){
    const total=c.basket.reduce((a,id)=>a+this.products.get(id).price,0), cost=c.basket.reduce((a,id)=>a+this.products.get(id).cost,0);
    c.paid=total; this.m.revenue+=total; this.m.cogs+=cost; this.m.purchases++; this.m.items+=c.basket.length;
    const txn='TX'+String(this.m.purchases).padStart(5,'0');
    this.emit('CustomerCompletedPurchase',c,null,`Customer ${c.id} paid ₱${total} (${c.basket.length} items).`,{transactionId:txn});
    const need=c.src.mission.productIds.length, got=c.basket.length;
    this.finish(c, got>=Math.ceil(need*0.75) ? 'COMPLETED' : 'FAILED');
  }
  finish(c,outcome){
    c.outcome=outcome; const need=c.src.mission.productIds.length;
    c.satisfaction=Math.round(100*Math.min(1,c.basket.length/need)*(c.substituted.length?0.92:1));
    if(outcome==='COMPLETED'){ this.m.completed++; this.emit('CustomerCompletedMission',c,null,`Customer ${c.id} completed mission "${c.src.mission.name}" (${c.basket.length}/${need}).`); }
    else if(outcome==='FAILED'){ this.m.failed++; this.emit('CustomerFailedMission',c,null,`Customer ${c.id} failed mission "${c.src.mission.name}" (${c.basket.length}/${need}).`); }
    else { this.m.abandoned++; this.emit('CustomerAbandonedBasket',c,null,`Customer ${c.id} left with an empty basket.`); }
    c.decision=outcome==='COMPLETED'?'Mission completed':outcome==='FAILED'?'Mission failed':'Abandoned – left without purchase';
  }

  /* ---- clock tick ---- */
  step(dt){
    this.t+=dt;
    for(const c of this.customers){
      if(c.state==='PENDING'){
        if(this.t>=c.src.arriveAtSec){
          c.state='ENTERING'; this.m.entered++; c.decision='Entering store';
          this.emit('CustomerEnteredStore',c,null,`Customer ${c.id} (${this.segName(c)}) entered store.`);
          this.walkTo(c,{x:0,z:FRONT_Z},'ENTERING');
        }
        continue;
      }
      if(c.state==='GONE') continue;
      this.advance(c,dt);
    }
  }
  advance(c,dt){
    if(!c.queue.length) this.nextStage(c);
    const st=c.queue[0]; if(!st) return;
    if(!st.started){ st.started=true; c.state=st.state; st.onStart&&st.onStart(); }
    if(st.k==='walk'){
      const dx=st.x-c.pos.x, dz=st.z-c.pos.z, d=Math.hypot(dx,dz), mv=c.speed*dt;
      c.heading=Math.atan2(dx,dz);
      if(d<=mv){ c.pos.x=st.x; c.pos.z=st.z; c.queue.shift(); if(st.vanish){ c.state='GONE'; } }
      else { c.pos.x+=dx/d*mv; c.pos.z+=dz/d*mv; }
    } else if(st.k==='wait'){
      c.wait+=dt; if(c.wait>=st.s){ c.wait=0; c.queue.shift(); st.onEnd&&st.onEnd(); }
    } else c.queue.shift();
  }

  /* ---- analytics (derived only from loaded data + simulation state) ---- */
  metrics(){
    const m=this.m, cs=this.customers, active=cs.filter(c=>c.state!=='PENDING'&&c.state!=='GONE');
    const done=m.completed+m.failed+m.abandoned, sats=cs.filter(c=>c.satisfaction!=null).map(c=>c.satisfaction);
    const avgSat=sats.length?sats.reduce((a,b)=>a+b,0)/sats.length:null, success=done?m.completed/done:null;
    const avail=1-this.stockedOut.size/this.products.size;
    // SAMPLE formula – placeholder weights, not a validated MissionCommerce definition
    const score=done?Math.round(100*(0.5*success+0.3*(avgSat/100)+0.2*avail)):null;
    return {
      active:active.length, entering:active.filter(c=>c.state==='ENTERING').length,
      shopping:active.filter(c=>['BROWSING','VIEWING_PRODUCT','COMPARING','SELECTING'].includes(c.state)).length,
      checkout:active.filter(c=>c.state==='CHECKOUT').length,
      completed:m.completed, failed:m.failed, abandoned:m.abandoned, revenue:m.revenue, gross:m.revenue-m.cogs,
      avgBasket:m.purchases?m.revenue/m.purchases:null, conversion:m.entered?m.purchases/m.entered:null,
      stockouts:this.stockedOut.size, entered:m.entered, avgSat, score, success, processed:m.processed,
      lowStock:[...this.stock.entries()].filter(([,v])=>v>0&&v<=5).length,
    };
  }
}

    this.box(36.4,0.15,0.5,trim,0,H,-13.4); this.box(0.5,0.15,26.4,trim,-18.2,H,-0.5); this.box(0.5,0.15,26.4,trim,18.2,H,-0.5);

  buildCustomers(){

  setSelected(id){ this.selectedId=id; if(!id) this.followId=null; this.refreshHighlights(); }
  refreshHighlights(){

    const need=new Set(c?c.src.mission.productIds.filter(p=>!c.selected.includes(p)&&!c.rejected.includes(p)):[]);
    this.slotMats.forEach((mat,pid)=>{
      const out=(this.engine.stock.get(pid)||0)<=0;

  setCamera(mode,instant){
    const iso=ISO_DIR.clone().multiplyScalar(60);
    const presets={overview:[iso.toArray(),[0,0,0],1], top:[[0,90,0.01],[0,0,0],1], free:null};
    if(mode==='follow'){ if(!this.selectedId) return; this.followId=this.selectedId; this.mode='follow'; this.cam=null; return; }
    this.followId=null; this.mode=mode; const p=presets[mode]; if(!p) return;
    const to={pos:new THREE.Vector3(...p[0]),tgt:new THREE.Vector3(...p[1]),zoom:p[2]};
    if(instant){ this.camera.position.copy(to.pos); this.controls.target.copy(to.tgt); this.camera.zoom=to.zoom; this.camera.updateProjectionMatrix(); this.controls.update(); }
    else this.cam={from:{pos:this.camera.position.clone(),tgt:this.controls.target.clone(),zoom:this.camera.zoom},to,k:0};
  }
  render(dt){
    if(this.cam){ this.cam.k=Math.min(1,this.cam.k+dt/0.8); const e=this.cam.k*this.cam.k*(3-2*this.cam.k);
      this.camera.position.lerpVectors(this.cam.from.pos,this.cam.to.pos,e); this.controls.target.lerpVectors(this.cam.from.tgt,this.cam.to.tgt,e);
      this.camera.zoom=this.cam.from.zoom+(this.cam.to.zoom-this.cam.from.zoom)*e; this.camera.updateProjectionMatrix(); if(this.cam.k>=1) this.cam=null; }
    const now=performance.now()/1000;
    for(const c of this.engine.customers){
      const g=this.meshes.get(c.id), vis=c.state!=='PENDING'&&c.state!=='GONE'; g.visible=vis; if(!vis) continue;
      g.position.set(c.pos.x,0,c.pos.z); if(c.heading!==undefined) g.rotation.y=c.heading;
      g.userData.cart.visible=c.basket.length>0;
      const bob=['BROWSING','ENTERING'].includes(c.state)||c.state==='COMPLETED'||c.state==='FAILED'||c.state==='ABANDONED';
      g.userData.body.position.y=.55+(bob?Math.abs(Math.sin(now*6+c.src.arriveAtSec))*0.06:0);
      g.userData.dot.material.color.setHex(STATE_COLORS[c.state]??0xffffff);
    }
    const sel=this.selectedId&&this.engine.customers.find(x=>x.id===this.selectedId);
    if(sel&&sel.state!=='PENDING'&&sel.state!=='GONE'){
      this.ring.visible=true; this.ring.position.set(sel.pos.x,0.06,sel.pos.z); this.ring.scale.setScalar(1+Math.sin(now*5)*0.08);
      if(this.followId===sel.id){
        const d=new THREE.Vector3(sel.pos.x,1,sel.pos.z).sub(this.controls.target).multiplyScalar(Math.min(1,dt*6));
        this.controls.target.add(d); this.camera.position.add(d);
        this.camera.zoom+=(2.6-this.camera.zoom)*Math.min(1,dt*3); this.camera.updateProjectionMatrix();
      }
    } else this.ring.visible=false;
    this.controls.update(); this.renderer.render(this.scene,this.camera);
  }
}

const UI = {

  engine:null, world:null, running:false, speed:10, selectedId:null, dirtyTl:true, filter:'ALL', lastTl:0, fps:0, evRate:0,

  /* ----- wizard ----- */

  header(){ return `<h1>Sim.PesoWeb 3D Customer Simulation</h1>

    else if(!w.error&&!w.report){

  wizStart(){ this.wiz.step=0; this.wiz.error=null; this.wiz.tenants=null; this.wizRender();

  back(step){ const w=this.wiz; w.step=step; w.report=null; if(step===0){w.tenant=null;} this.wizRender(); },
  async pickTenant(id){ const w=this.wiz; w.tenant=w.tenants.find(t=>t.id===id); w.step=1; w.branches=null; this.wizRender();

  async pickBranch(id){ const w=this.wiz; w.branch=w.branches.find(b=>b.id===id); w.step=2; w.scenarios=null; this.wizRender();
    try{ w.scenarios=await provider.getScenarios(w.tenant.id,id); }catch(e){w.error=e.message;} this.wizRender(); },
  pickScenario(id){ const w=this.wiz; w.scenario=w.scenarios.find(s=>s.id===id); w.step=3; this.wizRender(); },
  async loadScenario(){
    const w=this.wiz, steps=['Loading scenario…','Validating scenario…','Building 3D world…','Initializing customers…','Starting simulation…'];
    const tick=async(i)=>{ w.loading={title:'Loading '+w.scenario.name,steps,i}; await this.wizRender(); await new Promise(r=>setTimeout(r,120)); };
    try{
      await tick(0);
      const sc=await provider.getScenario(w.tenant.id,w.branch.id,w.scenario.id);
      await tick(1);

      await tick(4); w.loading=null; this.buildApp(rep.warns); this.start();

  start(){ this.last=performance.now(); const loop=now=>{ this.raf=requestAnimationFrame(loop); const dt=Math.min((now-this.last)/1000,0.1); this.last=now; this.fps=this.fps*.9+(1/Math.max(dt,.001))*.1;

      <div class="mute" style="margin-top:8px;font-size:11px">Dot above head = current state: grey browsing · blue viewing · yellow comparing · teal selecting · purple checkout · green done · red failed.</div>`; return; }

  renderTimeline(){

      <button class="${this.filter==='KEY'?'on':''}" onclick="UI.filter='KEY';UI.dirtyTl=true">Key events</button><button class="${this.filter==='ALL'?'on':''}" onclick="UI.filter='ALL';UI.dirtyTl=true">All</button>
      <span class="mute">${this.engine.events.length} events</span></div>`+
      evs.map(e=>`<div class="ev" ${e.customerId?`onclick="UI.select('${e.customerId}')"`:''}><span class="t mono">${fmtClock(e.t)}</span><span style="color:${col(e.type)}">${esc(e.text)}</span></div>`).join('');
    tl.scrollTop=keepTop;
  },
};
/* allow ?source=mock|api for demonstrating the "never silently fall back" rule */
(function(){ const q=new URLSearchParams(location.search).get('source'); if(q==='api'){ CONFIG.dataSource='api'; } })();
// re-resolve provider after possible override
(function(){ if(CONFIG.dataSource==='api'){ window.provider = null; } })();
</script>
<script>
// provider is const above; if ?source=api, swap behaviour by wrapping (kept simple for the sample)
if(new URLSearchParams(location.search).get('source')==='api'){
  const real=new RealSimulationDataProvider();
  ['getTenants','getBranches','getScenarios','getScenario'].forEach(m=>provider[m]=real[m].bind(real));
  provider.label=()=>real.label();
}
UI.wizStart();
// ?demo=1 : skip the wizard (Tenant -> Branch -> first scenario) and start running; handy for screenshots. Optional &speed=N &select=C1005
(async function(){
  const q=new URLSearchParams(location.search); if(!q.get('demo')) return;
  const w=UI.wiz; w.tenants=await provider.getTenants(); await UI.pickTenant(w.tenants[0].id);
  await UI.pickBranch(w.branches[0].id); UI.pickScenario(w.scenarios[0].id); await UI.loadScenario();
  UI.setSpeed(+q.get('speed')||10); UI.toggle();
  for(let i=0;i<(+q.get('ff')||0)*4;i++) UI.engine.step(0.25);   // &ff=SECONDS pre-advances the clock
  if(q.get('select')) UI.select(q.get('select'));
})();
</script>
