# Sim.PesoWeb: simulator + AI core + results dashboard. PesoWeb (the system under test) is external.
#   docker compose up dashboard            # results dashboard on http://localhost:8080/ui/dashboard/
#   docker compose run --rm sim python -m simpeso.quicksim --out ../results/quicksim.json
#   PESOWEB_ROOT_PASSWORD=... docker compose run --rm sim python -m simpeso.proof --seeds 1-3 --out ../results/proof-smoke.json
services:
  sim:
    build: .
    environment:
      PESOWEB_URL: ${PESOWEB_URL:-http://host.docker.internal:5071}
      PESOWEB_ROOT_PASSWORD: ${PESOWEB_ROOT_PASSWORD:-}
      VLLM_URL: ${VLLM_URL:-}
    volumes:
      - ./results:/app/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
  dashboard:
    image: python:3.12-slim
    working_dir: /site
    command: ["python", "-m", "http.server", "8080"]
    volumes:
      - ./ui:/site/ui:ro
      - ./results:/site/results:ro
    ports:
      - "8080:8080"
